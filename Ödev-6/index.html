<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DolandırBeni</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Serif+Caption:ital@0;1&family=Slackey&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="navbar-container">
        <a class="logo-container" href="">DolandırBeni</a>
        <input class="search-container" placeholder="Ürün,Kategori,Marka Ara" />
        <div class="addtoCart-container" onclick="openCart()" href="">
          Sepet
        </div>
      </div>
      <div class="offer-container">
        <img src="./img/Unknown.jpg" />
      </div>
      <div class="item-container">
        <div class="categoryList-container"></div>
        <div class="itemcard-container"></div>
      </div>
    </div>
    <div class="cartOverlay-container" id="cartOverlay" style="display: none">
      <div class="cartModal-container">
        <div class="cartHeader-container">
          <h2>Sepetim</h2>
          <button onclick="closeCart()" class="close-btn">X</button>
        </div>
        <div class="cartItems-container" id="cartItems"></div>
        <div class="cartTotal-container" id="cartTotal">Toplam: 0 $</div>
      </div>
    </div>
    <script src="./cart.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
